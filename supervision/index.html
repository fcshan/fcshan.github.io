---
layout: default
title: 监督公示
---

<div class="hero">
    <h1>监督公示</h1>
    <p>政府执法检查、居民投诉处理、水质检测报告等监督信息</p>
</div>

<div class="supervision-list">
    {% assign sorted_supervision = site.supervision | sort: 'date' | reverse %}
    {% for post in sorted_supervision %}
    <article class="supervision-item">
        <span class="supervision-date">{{ post.date | date: "%Y-%m-%d" }}</span>
        <h3><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3>
    </article>
    {% endfor %}
</div>
