---
layout: default
title: 小区区域
---

<div class="hero">
    <h1>小区区域</h1>
    <p>{{ site.title }} 包含两片住宅区域</p>
</div>

<div class="area-cards">
    {% for area_id in site.data.areas %}
    {% assign area = area_id[1] %}
    <div class="area-card">
        <h2>{{ area.full_name }}</h2>
        <p class="phase">第 {{ area.phase }} 期</p>
        <p>{{ area.description }}</p>
        <a href="{{ area_id[0] | relative_url }}/">了解详情 →</a>
    </div>
    {% endfor %}
</div>
