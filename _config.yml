# 翡翠山城别墅区 业主公示网站配置
# ============================================

# 站点基础信息
title: "翡翠山城别墅区"
subtitle: "业主公共事务信息公示平台"
description: "翡翠山城别墅区（爱丁堡·红郡）业主大会官方信息公示平台"
url: "https://fcshan.github.io"
baseurl:

# 时区与语言
timezone: Asia/Shanghai
lang: zh-CN

# 构建配置
markdown: kramdown
highlighter: rouge
permalink: /:categories/:year/:month/:day/:title/

# Jekyll 插件（GitHub Pages 白名单内）
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate

# 分页配置
paginate: 10
paginate_path: "/announcements/page/:num/"

# 集合配置
collections:
  announcements:
    output: true
    permalink: /announcements/:name/
  decisions:
    output: true
    permalink: /decisions/:name/
  finance:
    output: true
    permalink: /finance/:name/
  projects:
    output: true
    permalink: /projects/:name/
  rules:
    output: true
    permalink: /rules/:name/
  areas:
    output: true
    permalink: /areas/:name/

# 默认 Front Matter
defaults:
  - scope:
      path: ""
      type: "announcements"
    values:
      layout: "announcement"
  - scope:
      path: ""
      type: "decisions"
    values:
      layout: "document"
  - scope:
      path: ""
      type: "finance"
    values:
      layout: "document"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "document"
  - scope:
      path: ""
      type: "rules"
    values:
      layout: "document"
  - scope:
      path: ""
      type: "areas"
    values:
      layout: "area"

# 小区区域配置
areas:
  aidingbao:
    name: "爱丁堡"
    phase: "1期"
    full_name: "爱丁堡（1期）"
    description: "翡翠山城别墅区一期住宅区"
  hongjun:
    name: "红郡"
    phase: "2期"
    full_name: "红郡（2期）"
    description: "翡翠山城别墅区二期住宅区"

# 业主大会信息
committee:
  name: "翡翠山城别墅区临时业主大会筹备组"
  term: "业主大会"
  established_date: "2026-03-15"
  office_address: "微信:翡翠山别墅换物业业主大会群"
  office_hours: "每周六 14:00-17:00"
  contact_phone: "0755-XXXXXXXX 尚未确定"
  email: "fcshan-xxx@gmail.com 尚未确定"
  supervisor: "惠州市住房和城乡建设局 / 大亚湾区大亚湾西区办事处"
  supervisor_phone: "0752-5102661"

# 免责声明（全局引用）
disclaimer: >
  本网站为翡翠山城别墅区临时业主大会筹备组，依法设立的信息公示平台，旨在提升小区公共事务透明度。 
  网站所载内容均为临时业主大会依法定程序形成的结果信息。如对公示内容有异议， 请通过书面形式向临时业主大会筹备组反映
# 版权信息
copyright: "© 2026 翡翠山城别墅区临时业主大会筹备组 版权所有"

# 排除文件
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata
