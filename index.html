---
layout: default
title: 首页
---

<div class="hero">
    <h1>{{ site.title }}</h1>
    <p>{{ site.description }}</p>
</div>

<section class="announcements-section">
    <h2>最新公告</h2>
    <div class="announcements-list">
        {% for post in site.announcements limit:5 %}
        <article class="announcement-item">
            <span class="announcement-date">{{ post.date | date: "%Y-%m-%d" }}</span>
            <h3><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3>
        </article>
        {% endfor %}
    </div>
    <a href="{{ '/announcements/' | relative_url }}" class="view-all">查看全部公告</a>
</section>

<section class="quick-links">
    <h2>快捷链接</h2>
    <div class="links-grid">
        <a href="{{ '/decisions/' | relative_url }}" class="quick-link">决策公示</a>
        <a href="{{ '/finance/' | relative_url }}" class="quick-link">财务公开</a>
        <a href="{{ '/projects/' | relative_url }}" class="quick-link">项目公示</a>
        <a href="{{ '/rules/' | relative_url }}" class="quick-link">规章制度</a>
    </div>
</section>
